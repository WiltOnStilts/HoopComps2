services:
  - type: web
    name: hoopcomps
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_NAME
        value: HoopComps
      - key: SPOTLIGHT_USER_EMAILS
        value: builtwilt@icloud.com
      # Set DATABASE_URL in the Render dashboard (Neon Postgres connection string)
