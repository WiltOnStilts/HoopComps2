services:
  - type: web
    name: hoopcomps
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_NAME
        value: HoopComps
      - key: USE_FILE_STORE
        value: "1"
      - key: SPOTLIGHT_USER_EMAILS
        value: builtwilt@icloud.com
    disk:
      name: hoopcomps-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
