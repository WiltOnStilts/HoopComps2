<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="DynastyDraft — daily basketball team-building game. Spin, draft, simulate your dynasty." />
    <title>DynastyDraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="app-bg" aria-hidden="true"></div>

    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark">🏀</span>
        <h1 class="brand-title">DynastyDraft</h1>
        <div class="top-bar-stats hidden" id="topBarStats">
          <div class="top-stat-pill"><span>Streak</span><strong id="topBarStreak">0🔥</strong></div>
          <div class="top-stat-pill"><span>Best</span><strong id="topBarBest">—</strong></div>
        </div>
      </div>
      <div class="header-actions">
        <span id="authStatusPill" class="auth-pill hidden"></span>
        <button type="button" class="btn-ghost btn-sm" id="authHeaderBtn">Sign in</button>
      </div>
    </header>

    <main class="app-main">
      <div id="gameRoot" class="game-layout"></div>
    </main>

    <div id="authModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop" id="authModalBackdrop"></div>
      <div class="modal-card">
        <button type="button" class="modal-close" id="authModalClose" aria-label="Close">×</button>
        <h2 id="authModalTitle">Sign in</h2>
        <form id="authForm" class="auth-form">
          <label>
            Email
            <input type="email" id="authEmail" required autocomplete="email" />
          </label>
          <label id="authNameField" class="hidden">
            Display name
            <input type="text" id="authDisplayName" autocomplete="name" />
          </label>
          <label id="authUsernameField" class="hidden">
            Username
            <input type="text" id="authUsername" autocomplete="username" placeholder="for friend search" />
          </label>
          <label>
            Password
            <input type="password" id="authPassword" required minlength="6" autocomplete="current-password" />
          </label>
          <p class="error" id="authError"></p>
          <button type="submit" class="btn-primary" id="authSubmitBtn" data-mode="login">Sign in</button>
        </form>
        <p class="hint" id="authSwitchText"></p>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
